<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26221E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>My Soundboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --console:#26221E; --panel:#1B1712; --well:#141009; --ink:#20150C;
  --cream:#F2E9DA; --dim:#9C8F7C; --lampred:#FF4B33; --amber:#F2B33D;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--console); color:var(--cream);
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
  min-height:100vh; display:flex; flex-direction:column;
}
/* ---------- console header ---------- */
header.console{
  position:sticky; top:0; z-index:5;
  background:linear-gradient(var(--panel), var(--console));
  border-bottom:1px solid #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 2px 8px rgba(0,0,0,.35);
  padding:12px 16px 12px; padding-top:calc(12px + env(safe-area-inset-top));
}
.row{display:flex; flex-wrap:wrap; align-items:center; gap:10px; max-width:1100px; margin:0 auto}
.row.top{margin-bottom:10px}
h1{
  flex:1; margin:0; font-weight:900; font-stretch:118%;
  text-transform:uppercase; letter-spacing:.02em;
  font-size:clamp(19px, 4vw, 28px); line-height:1; min-width:140px;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.count{font-size:11px; letter-spacing:.22em; color:var(--dim); white-space:nowrap}
/* ON AIR lamp */
.lamp{
  display:flex; align-items:center; gap:9px;
  background:var(--well); border:1px solid #000; border-radius:9px;
  padding:7px 13px; box-shadow:inset 0 2px 5px rgba(0,0,0,.6);
}
.bulb{
  width:12px; height:12px; border-radius:50%;
  background:#4a221b; box-shadow:inset 0 0 3px #000;
  transition:background .15s, box-shadow .15s;
}
.lamp.on .bulb{
  background:var(--lampred);
  box-shadow:0 0 14px 3px rgba(255,75,51,.65), inset 0 0 2px rgba(255,255,255,.6);
  animation:hum 2.2s infinite;
}
.lamp.hold .bulb{background:#B07E1E; box-shadow:0 0 10px 2px rgba(242,179,61,.5)}
@keyframes hum{0%,100%{opacity:1}50%{opacity:.86}}
.lamp-text{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.28em; color:var(--dim); transition:color .15s}
.lamp.on .lamp-text{color:#FFB4A6}
.lamp.hold .lamp-text{color:#E4C87F}
/* controls */
.ctl-label{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); margin-right:2px}
.speed{display:flex; align-items:center; gap:8px}
.seg{display:flex; gap:2px; background:var(--well); border:1px solid #000; border-radius:9px; padding:3px}
.seg button{
  font-family:'IBM Plex Mono',monospace; font-size:12px; padding:5px 9px;
  border:0; border-radius:6px; background:transparent; color:var(--dim); cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--amber); color:var(--ink); font-weight:600}
.chip{display:inline-flex; cursor:pointer; position:relative}
.chip input{position:absolute; opacity:0; width:0; height:0}
.chip span{
  font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--dim);
  background:var(--well); border:1px solid #000; border-radius:9px; padding:8px 12px;
  transition:background .1s, color .1s;
}
.chip input:checked + span{background:#63B995; color:var(--ink); font-weight:600}
.chip input:focus-visible + span, .seg button:focus-visible, .stop:focus-visible,
.btn:focus-visible, .tbtn:focus-visible, .rplay:focus-visible{outline:3px solid var(--cream); outline-offset:2px}
.stop{
  font-family:'IBM Plex Mono',monospace; font-size:12px; cursor:pointer;
  background:#3A1E17; color:#FFB4A6; border:1px solid #000; border-radius:9px; padding:8px 13px;
}
.stop:active{transform:translateY(1px)}
.filter{
  flex:1; min-width:130px; max-width:230px; font-size:13px;
  background:var(--well); border:1px solid #000; border-radius:9px;
  color:var(--cream); padding:8px 12px;
}
.filter::placeholder{color:var(--dim)}
/* ---------- notices ---------- */
#notice{max-width:1100px; margin:0 auto; width:100%}
.notice{
  margin:16px 16px 0; padding:13px 16px; border-radius:11px;
  background:rgba(242,179,61,.09); border:1px solid rgba(242,179,61,.35);
  font-size:13.5px; line-height:1.5;
}
.notice.card{background:var(--panel); border:1px solid #000; padding:22px 20px}
.notice.card p{margin:.7em 0; color:var(--dim)}
.notice.card strong{font-size:16px; letter-spacing:.02em}
.notice pre{
  background:var(--well); border-radius:8px; padding:11px 13px; overflow-x:auto;
  font-size:12px; color:#E4C87F; margin:.7em 0;
}
.btn{
  font:inherit; font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:13px;
  background:var(--amber); color:var(--ink); border:0; border-radius:10px;
  padding:11px 16px; cursor:pointer;
  box-shadow:0 4px 0 #B07E1E, 0 6px 10px rgba(0,0,0,.4);
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 #B07E1E}
/* ---------- zones & the cart wall ---------- */
main{flex:1; padding-bottom:96px}
#board{max-width:1100px; margin:0 auto; padding:6px 16px 8px}
.zone-h{
  display:flex; align-items:center; gap:12px; margin:20px 2px 12px;
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600;
  letter-spacing:.32em; color:var(--dim); text-transform:uppercase;
}
.zone-h::before{content:""; width:9px; height:9px; border-radius:2px; background:var(--zc,#9C8F7C)}
.zone-h::after{content:""; flex:1; height:1px; background:linear-gradient(90deg, rgba(255,255,255,.14), transparent)}
.grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(132px, 1fr));
  gap:14px;
}
.cart{
  position:relative; display:grid; justify-items:center; gap:7px;
  padding:16px 10px 12px; border:0; border-radius:14px; cursor:pointer;
  background:linear-gradient(rgba(255,255,255,.14), rgba(255,255,255,0) 34%), var(--c);
  color:var(--ink); font-family:inherit;
  box-shadow:0 5px 0 var(--edge), 0 8px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .06s, box-shadow .06s;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none;
}
.cart:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 var(--edge), 0 3px 6px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.25);
}
.cart:focus-visible{outline:3px solid var(--cream); outline-offset:3px}
.cart .emoji{font-size:34px; line-height:1.1; pointer-events:none}
.cart .label{
  font-weight:800; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase;
  text-align:center; line-height:1.2; pointer-events:none; overflow-wrap:anywhere;
}
/* sonogram strip: bar height = loudness, bar brightness = pitch */
.sono{
  position:relative; width:100%; height:24px; border-radius:5px; overflow:hidden;
  background:rgba(0,0,0,.16); box-shadow:inset 0 1px 2px rgba(0,0,0,.25); pointer-events:none;
}
.sono canvas{position:absolute; inset:0; width:100%; height:100%}
.sono i{position:absolute; left:0; top:0; bottom:0; width:0%; background:rgba(0,0,0,.32)}
body.dl .cart::after{
  content:"↓"; position:absolute; top:7px; right:9px;
  font-weight:900; font-size:13px; width:19px; height:19px; line-height:19px;
  background:rgba(0,0,0,.28); color:#fff; border-radius:50%;
}
.cart.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* ---------- table view ---------- */
.tblwrap{overflow-x:auto; border:1px solid #000; border-radius:12px; background:var(--panel); margin-top:14px}
table.tbl{width:100%; border-collapse:collapse; font-size:12.5px; min-width:640px}
.tbl th{
  font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:10.5px;
  letter-spacing:.18em; text-transform:uppercase; color:var(--dim);
  text-align:left; padding:11px 12px; border-bottom:1px solid #000;
  white-space:nowrap; cursor:pointer; -webkit-user-select:none; user-select:none;
}
.tbl th[data-dir="asc"]::after{content:" ▲"; color:var(--amber)}
.tbl th[data-dir="desc"]::after{content:" ▼"; color:var(--amber)}
.tbl td{padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.05); vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.live td{background:rgba(242,179,61,.07)}
.tbl tr.live td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.tbl .lbl{font-weight:700}
.tbl .src{color:var(--dim); max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tbl .num{font-family:'IBM Plex Mono',monospace; white-space:nowrap}
.whodot{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:7px; vertical-align:0; background:var(--wc,#9C8F7C)}
.rplay{
  width:30px; height:30px; border-radius:50%; border:1px solid #000; cursor:pointer;
  background:var(--well); color:var(--cream); display:grid; place-items:center; padding:0;
}
.rplay svg{width:11px; height:11px; fill:currentColor}
.rplay:active{transform:translateY(1px)}
/* ---------- transport dock ---------- */
.dock{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(14px + env(safe-area-inset-bottom)); z-index:8;
  display:flex; gap:14px; align-items:center;
  background:var(--well); border:1px solid #000; border-radius:99px;
  padding:9px 16px; box-shadow:0 10px 24px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
}
.tbtn{
  width:44px; height:44px; border-radius:50%; border:1px solid #000; cursor:pointer;
  background:linear-gradient(rgba(255,255,255,.08), rgba(255,255,255,0)), var(--panel);
  color:var(--cream); display:grid; place-items:center; padding:0;
  box-shadow:0 3px 0 #000, inset 0 1px 0 rgba(255,255,255,.09);
  transition:background .12s, color .12s;
}
.tbtn:active{transform:translateY(2px); box-shadow:0 1px 0 #000}
.tbtn svg{width:15px; height:15px; fill:currentColor}
.tbtn[aria-pressed="true"]{background:var(--amber); color:var(--ink)}
/* ---------- footer / toast ---------- */
footer{
  padding:6px 16px calc(80px + env(safe-area-inset-bottom));
  text-align:center; font-size:10.5px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--dim);
}
#toast{
  position:fixed; left:50%; bottom:86px; transform:translateX(-50%) translateY(140px);
  background:var(--well); color:var(--cream); border:1px solid #000; border-radius:99px;
  padding:10px 18px; font-size:13px; box-shadow:0 8px 18px rgba(0,0,0,.5);
  transition:transform .25s; z-index:9; max-width:88vw;
}
#toast.show{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important; transition:none!important}
}
</style>
</head>
<body>
<header class="console">
  <div class="row top">
    <div class="lamp" id="lamp" role="status">
      <span class="bulb"></span><span class="lamp-text" id="lampText">STANDBY</span>
    </div>
    <h1 id="boardTitle">My Soundboard</h1>
    <div class="count mono" id="count"></div>
  </div>
  <div class="row controls">
    <div class="speed" role="group" aria-label="Playback speed">
      <span class="ctl-label">Speed</span>
      <div class="seg" id="speedSeg"></div>
    </div>
    <div class="seg" id="viewSeg" role="group" aria-label="View"></div>
    <label class="chip"><input type="checkbox" id="pitchChk"><span>Keep pitch</span></label>
    <label class="chip"><input type="checkbox" id="dlChk"><span>Download mode</span></label>
    <button class="stop" id="stopBtn">Stop all</button>
    <input id="filter" class="filter mono" type="search" placeholder="Filter carts" hidden>
  </div>
</header>

<div id="notice"></div>
<main><div id="board"></div></main>
<footer id="foot"></footer>

<div class="dock" role="group" aria-label="Transport">
  <button class="tbtn" id="playBtn" aria-label="Resume playback">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5v13l11-6.5z"/></svg>
  </button>
  <button class="tbtn" id="pauseBtn" aria-label="Pause playback" aria-pressed="false">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5h3.6v13H3zM9.4 1.5H13v13H9.4z"/></svg>
  </button>
</div>

<div id="toast" role="status"></div>

<script>
/* ============ state ============ */
const CART_COLORS = [
  ["#F2B33D","#B07E1E"], ["#E4593F","#A03826"], ["#63B995","#3D8266"],
  ["#7FA8E0","#4F74AC"], ["#C79BE0","#9067AE"], ["#E4C87F","#AD9147"]
];
const GROUPS = [
  {key:'david', name:'David', color:'#7FA8E0'},
  {key:'max',   name:'Max',   color:'#63B995'},
  {key:'other', name:'Extras',color:'#9C8F7C'}
];
const state = {
  sounds:[], speed:1, keepPitch:false, dl:false, view:'grid',
  playing:new Map(), paused:false, demo:false,
  sort:{key:null, dir:1}
};
let seq = 0;
const el = id => document.getElementById(id);
const board = el('board'), lamp = el('lamp'), lampText = el('lampText');

/* ============ boot ============ */
async function boot(){
  buildSpeed(); buildViewSeg(); wire();
  try{
    const r = await fetch('soundbites.json?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const m = await r.json();
    if(m.title){ document.title = m.title; el('boardTitle').textContent = m.title; }
    state.sounds = m.sounds || [];
    if(state.sounds.length === 0) emptyState(); else render();
  }catch(e){
    demoMode();
  }
  if('serviceWorker' in navigator &&
     (location.protocol === 'https:' || ['localhost','127.0.0.1'].includes(location.hostname))){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}

function buildSpeed(){
  const seg = el('speedSeg');
  [0.5, 0.75, 1, 1.25, 1.5].forEach(v=>{
    const b = document.createElement('button');
    b.textContent = v + '\u00d7';
    b.setAttribute('aria-pressed', v === 1);
    b.onclick = ()=>{
      state.speed = v;
      seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x === b));
    };
    seg.appendChild(b);
  });
}

function buildViewSeg(){
  const seg = el('viewSeg');
  [['grid','Grid'],['table','Table']].forEach(([k, txt])=>{
    const b = document.createElement('button');
    b.textContent = txt;
    b.setAttribute('aria-pressed', k === state.view);
    b.onclick = ()=>{
      state.view = k;
      seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x === b));
      render();
    };
    seg.appendChild(b);
  });
}

function wire(){
  el('pitchChk').onchange = e => state.keepPitch = e.target.checked;
  el('dlChk').onchange = e => { state.dl = e.target.checked; document.body.classList.toggle('dl', state.dl); };
  el('stopBtn').onclick = stopAll;
  el('pauseBtn').onclick = pauseAll;
  el('playBtn').onclick = resumeAll;
  el('filter').oninput = applyFilter;
  addEventListener('keydown', e=>{
    if(e.target.matches('input')) return;
    if(e.key === 'Escape') return stopAll();
    if(e.key === ' '){ e.preventDefault(); return state.paused ? resumeAll() : pauseAll(); }
    const n = '1234567890'.indexOf(e.key);
    if(n > -1){
      const c = board.querySelectorAll('.cart:not([hidden])')[n];
      if(c) c.click();
    }
  });
  let rsz;
  addEventListener('resize', ()=>{ clearTimeout(rsz); rsz = setTimeout(redrawSonos, 150); });
}

function applyFilter(){
  const q = el('filter').value.trim().toLowerCase();
  board.querySelectorAll('.cart').forEach(c=>{ c.hidden = !!q && !c.dataset.q.includes(q); });
  board.querySelectorAll('tr[data-q]').forEach(r=>{ r.hidden = !!q && !r.dataset.q.includes(q); });
  board.querySelectorAll('.zone').forEach(z=>{
    z.hidden = !!q && !z.querySelector('.cart:not([hidden])');
  });
}

/* ============ grouping & render ============ */
function hash(s){ let h = 0; for(const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function colorFor(id){ return CART_COLORS[hash(id) % CART_COLORS.length]; }
function esc(t){ return String(t).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function groupOf(s){
  const w = String(s.who || '').toLowerCase();
  return (w === 'david' || w === 'max') ? w : 'other';
}
function groupMeta(key){ return GROUPS.find(g => g.key === key); }

function render(){
  board.innerHTML = '';
  if(state.view === 'grid') renderGrid(); else renderTable();
  el('count').textContent = state.sounds.length + (state.sounds.length === 1 ? ' CART' : ' CARTS');
  el('filter').hidden = state.sounds.length < 12;
  applyFilter();
  foot();
}

function renderGrid(){
  const buckets = {david:[], max:[], other:[]};
  state.sounds.forEach(s => buckets[groupOf(s)].push(s));
  const usedKeys = GROUPS.filter(g => buckets[g.key].length);
  const soloUnlabelled = usedKeys.length === 1 && usedKeys[0].key === 'other';
  usedKeys.forEach(g=>{
    const zone = document.createElement('section');
    zone.className = 'zone';
    if(!soloUnlabelled){
      const h = document.createElement('h2');
      h.className = 'zone-h';
      h.style.setProperty('--zc', g.color);
      h.textContent = g.name + ' \u00b7 ' + buckets[g.key].length;
      zone.appendChild(h);
    }
    const grid = document.createElement('div');
    grid.className = 'grid';
    buckets[g.key].forEach(s => grid.appendChild(tile(s)));
    zone.appendChild(grid);
    board.appendChild(zone);
  });
  requestAnimationFrame(()=> board.querySelectorAll('.sono canvas').forEach(initSono));
}

function tile(s){
  const [c, edge] = colorFor(s.id || s.label || 'x');
  const b = document.createElement('button');
  b.className = 'cart';
  b.style.setProperty('--c', c);
  b.style.setProperty('--edge', edge);
  b.dataset.q = ((s.label || '') + ' ' + (s.id || '') + ' ' + (s.who || '') + ' ' +
                 (s.source && s.source.title || '')).toLowerCase();
  b.innerHTML = '<span class="emoji">' + esc(s.emoji || '🔊') + '</span>' +
                '<span class="label">' + esc(s.label || s.id) + '</span>' +
                '<span class="sono"><canvas data-id="' + esc(s.id) + '"></canvas><i></i></span>';
  b.onclick = ()=> state.dl ? download(s) : playSound(s, b.querySelector('.sono i'), b);
  return b;
}

/* ============ table view ============ */
const COLS = [
  {key:'label', th:'Cart',    val:s => (s.label || s.id || '').toLowerCase()},
  {key:'who',   th:'Who',     val:s => GROUPS.findIndex(g => g.key === groupOf(s))},
  {key:'dur',   th:'Length',  val:s => durOf(s) ?? -1},
  {key:'ep',    th:'Episode', val:s => (s.source && s.source.title || '').toLowerCase()},
  {key:'at',    th:'At',      val:s => s.source && s.source.start_s != null ? s.source.start_s : -1},
  {key:'added', th:'Added',   val:s => s.added || ''}
];
function durOf(s){
  if(typeof s.duration_s === 'number') return s.duration_s;
  if(typeof s._dur === 'number') return s._dur;
  return null;
}
function fmtDur(d){ return d == null ? '\u2014' : (Math.round(d * 10) / 10) + 's'; }

function renderTable(){
  const sounds = [...state.sounds];
  if(state.sort.key){
    const col = COLS.find(c => c.key === state.sort.key);
    sounds.sort((a, b)=>{
      const x = col.val(a), y = col.val(b);
      return (x < y ? -1 : x > y ? 1 : 0) * state.sort.dir;
    });
  }
  const wrap = document.createElement('div');
  wrap.className = 'tblwrap';
  const t = document.createElement('table');
  t.className = 'tbl';
  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  hr.appendChild(document.createElement('th'));
  COLS.forEach(c=>{
    const th = document.createElement('th');
    th.textContent = c.th;
    if(state.sort.key === c.key) th.dataset.dir = state.sort.dir === 1 ? 'asc' : 'desc';
    th.onclick = ()=>{
      state.sort.dir = state.sort.key === c.key ? -state.sort.dir : 1;
      state.sort.key = c.key;
      render();
    };
    hr.appendChild(th);
  });
  thead.appendChild(hr); t.appendChild(thead);
  const tb = document.createElement('tbody');
  sounds.forEach(s=>{
    const g = groupMeta(groupOf(s));
    const tr = document.createElement('tr');
    tr.dataset.q = ((s.label || '') + ' ' + (s.id || '') + ' ' + (s.who || '') + ' ' +
                    (s.source && s.source.title || '')).toLowerCase();
    const at = s.source && s.source.start ? s.source.start + '\u2013' + (s.source.end || '?') : '\u2014';
    tr.innerHTML =
      '<td></td>' +
      '<td class="lbl">' + esc(s.emoji || '🔊') + ' ' + esc(s.label || s.id) + '</td>' +
      '<td><span class="whodot" style="--wc:' + g.color + '"></span>' + g.name + '</td>' +
      '<td class="num" data-dur="' + esc(s.id) + '">' + fmtDur(durOf(s)) + '</td>' +
      '<td class="src" title="' + esc(s.source && s.source.title || '') + '">' +
        esc(s.source && s.source.title || '\u2014') + '</td>' +
      '<td class="num">' + esc(at) + '</td>' +
      '<td class="num">' + esc(s.added || '\u2014') + '</td>';
    const pb = document.createElement('button');
    pb.className = 'rplay';
    pb.setAttribute('aria-label', 'Play ' + (s.label || s.id));
    pb.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5v13l11-6.5z"/></svg>';
    pb.onclick = ()=> state.dl ? download(s) : playSound(s, null, tr);
    tr.firstChild.appendChild(pb);
    tb.appendChild(tr);
    if(durOf(s) == null && !s.synth) analyzeQueued(s, null);   // fill Length lazily
  });
  t.appendChild(tb); wrap.appendChild(t); board.appendChild(wrap);
}

function foot(){
  el('foot').textContent = (state.demo ? 'Demo mode · ' : '') + 'Add & manage carts with tools/soundbite.py';
}

/* ============ sonogram (bar height = loudness, brightness = pitch) ============ */
const sonoCache = new Map();   // id -> frames [{a,p}]
let anaChain = Promise.resolve();

function decode(ctx, ab){
  return new Promise((res, rej)=>{
    const p = ctx.decodeAudioData(ab, res, rej);
    if(p && p.then) p.then(res, rej);
  });
}

async function analyze(s){
  if(sonoCache.has(s.id)) return sonoCache.get(s.id);
  const SR = 44100;
  let data, len;
  if(s.synth){
    const oc = new OfflineAudioContext(1, SR * 4, SR);
    const g = oc.createGain(); g.connect(oc.destination);
    const dur = DEMOS[s.synth](oc, g, 1, 1);
    const buf = await oc.startRendering();
    data = buf.getChannelData(0);
    len = Math.min(data.length, Math.ceil((dur + .05) * SR));
    s._dur = len / SR;
  }else{
    const r = await fetch(s.file);
    if(!r.ok) throw new Error(r.status);
    const buf = await decode(new OfflineAudioContext(1, SR, SR), await r.arrayBuffer());
    data = buf.getChannelData(0);
    len = data.length;
    s._dur = buf.duration;
  }
  const N = 56, step = Math.max(1, Math.floor(len / N)), frames = [];
  let maxA = 1e-6;
  for(let i = 0; i < N; i++){
    const a0 = i * step, a1 = Math.min(a0 + step, len);
    let sum = 0, zc = 0, prev = data[a0] || 0;
    for(let j = a0; j < a1; j++){
      const v = data[j];
      sum += v * v;
      if((v >= 0) !== (prev >= 0)) zc++;
      prev = v;
    }
    const n = Math.max(1, a1 - a0);
    const rms = Math.sqrt(sum / n);
    const hz = (zc / n) * SR / 2;              // zero-crossing pitch estimate
    frames.push({a:rms, p:Math.min(1, hz / 2400)});
    maxA = Math.max(maxA, rms);
  }
  frames.forEach(f => f.a = f.a / maxA);
  sonoCache.set(s.id, frames);
  return frames;
}

function analyzeQueued(s, canvas){
  anaChain = anaChain
    .then(()=> analyze(s))
    .then(frames=>{
      if(canvas && canvas.isConnected) drawSono(canvas, frames);
      const cell = board.querySelector('[data-dur="' + (window.CSS ? CSS.escape(s.id) : s.id) + '"]');
      if(cell) cell.textContent = fmtDur(durOf(s));
    })
    .catch(()=>{ /* leave placeholder line */ });
}

function initSono(cv){
  drawPlaceholder(cv);
  const s = state.sounds.find(x => x.id === cv.dataset.id) ||
            DEMO_SET.find(x => x.id === cv.dataset.id);
  if(s) analyzeQueued(s, cv);
}

function sizeCanvas(cv){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = cv.clientWidth || 100, H = cv.clientHeight || 24;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [g, W, H];
}

function drawPlaceholder(cv){
  const [g, W, H] = sizeCanvas(cv);
  g.fillStyle = 'rgba(0,0,0,.35)';
  g.fillRect(2, H / 2 - .5, W - 4, 1);
}

function drawSono(cv, frames){
  const [g, W, H] = sizeCanvas(cv);
  const n = frames.length, bw = W / n;
  const lo = [30, 18, 8], hi = [255, 252, 244];   // dark = low pitch, bright = high pitch
  for(let i = 0; i < n; i++){
    const f = frames[i];
    const h = Math.max(1.6, f.a * (H - 3));
    const c = lo.map((v, k) => Math.round(v + (hi[k] - v) * f.p));
    g.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',.92)';
    g.fillRect(i * bw + bw * .18, (H - h) / 2, bw * .64, h);
  }
}

function redrawSonos(){
  board.querySelectorAll('.sono canvas').forEach(cv=>{
    const fr = sonoCache.get(cv.dataset.id);
    fr ? drawSono(cv, fr) : drawPlaceholder(cv);
  });
}

/* ============ playback & transport ============ */
function playSound(s, bar, rowEl){
  if(s.synth) return playDemo(s, bar, rowEl);
  const a = new Audio(s.file);
  a.preservesPitch = state.keepPitch;
  a.webkitPreservesPitch = state.keepPitch;
  a.mozPreservesPitch = state.keepPitch;
  a.playbackRate = state.speed;
  const token = ++seq;
  if(rowEl) rowEl.classList.add('live');
  if(bar) a.addEventListener('timeupdate', ()=>{ if(a.duration) bar.style.width = (a.currentTime / a.duration * 100) + '%'; });
  const done = ()=>{
    state.playing.delete(token);
    if(bar) bar.style.width = '0%';
    if(rowEl) rowEl.classList.remove('live');
    if(state.playing.size === 0) state.paused = false;
    lampSync();
  };
  a.addEventListener('ended', done);
  a.addEventListener('error', ()=>{
    done();
    if(rowEl && rowEl.classList.contains('cart')){
      rowEl.classList.add('err'); setTimeout(()=>rowEl.classList.remove('err'), 500);
    }
    toast('Could not load ' + (s.file || 'sound'));
  });
  state.playing.set(token, {
    stop: ()=>{ a.pause(); done(); },
    pause: ()=>{ a.pause(); },
    resume: ()=>{ a.play().catch(()=>done()); }
  });
  state.paused = false;
  lampSync();
  a.play().catch(()=>done());
}

function stopAll(){
  [...state.playing.values()].forEach(p => p.stop());
  state.playing.clear();
  state.paused = false;
  lampSync();
}

function pauseAll(){
  if(state.playing.size === 0) return toast('Nothing is playing');
  state.paused = true;
  state.playing.forEach(p => p.pause && p.pause());
  lampSync();
}

function resumeAll(){
  if(state.playing.size === 0) return toast('Nothing to resume \u2014 tap a cart');
  if(!state.paused) return;
  state.paused = false;
  state.playing.forEach(p => p.resume && p.resume());
  lampSync();
}

function lampSync(){
  const any = state.playing.size > 0;
  lamp.classList.toggle('on', any && !state.paused);
  lamp.classList.toggle('hold', any && state.paused);
  lampText.textContent = !any ? 'STANDBY' : state.paused ? 'PAUSED' : 'ON AIR';
  el('pauseBtn').setAttribute('aria-pressed', any && state.paused);
}

function download(s){
  if(s.synth) return toast('Demo carts are synthesized in the browser \u2014 nothing to download');
  const a = document.createElement('a');
  a.href = s.file;
  a.download = (s.id || 'sound') + s.file.slice(s.file.lastIndexOf('.'));
  document.body.appendChild(a); a.click(); a.remove();
}

let toastT;
function toast(msg){
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ============ empty & demo states ============ */
function emptyState(){
  el('notice').innerHTML =
    '<div class="notice card"><strong>No carts loaded.</strong>' +
    '<p>Cut your first clip from a terminal (WSL2 / Linux / macOS):</p>' +
    '<pre class="mono">python3 tools/soundbite.py clip episode.mp3 --start 12:41 --end 12:44 --id first-laugh --emoji 😂 --who david</pre>' +
    '<p>Then refresh this page. Or hear how the board feels with placeholder sounds:</p>' +
    '<button class="btn" id="demoBtn">Load demo carts</button></div>';
  el('demoBtn').onclick = ()=>{ el('notice').innerHTML = ''; demoMode(); };
  el('count').textContent = '0 CARTS';
  foot();
}

function demoMode(){
  state.demo = true;
  el('notice').innerHTML =
    '<div class="notice">Demo carts \u2014 no <b>soundbites.json</b> found, so these are browser-synthesized placeholders ' +
    'split into placeholder David / Max zones. Your real clips replace them once the board is set up.</div>';
  state.sounds = DEMO_SET;
  render();
}

/* ============ demo synth (Web Audio) ============ */
let AC;
function ctx(){
  AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  if(AC.state === 'suspended' && !state.paused) AC.resume();
  return AC;
}
function tone(ac, out, o){
  const opt = Object.assign({type:'sine', f0:440, f1:0, t0:0, d:.2, g:.5}, o);
  const osc = ac.createOscillator(), v = ac.createGain();
  osc.type = opt.type;
  const T = ac.currentTime + opt.t0;
  osc.frequency.setValueAtTime(Math.max(opt.f0,1), T);
  if(opt.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(opt.f1,1), T + opt.d);
  v.gain.setValueAtTime(0.0001, T);
  v.gain.linearRampToValueAtTime(opt.g, T + .012);
  v.gain.exponentialRampToValueAtTime(.001, T + opt.d);
  osc.connect(v); v.connect(out);
  osc.start(T); osc.stop(T + opt.d + .05);
}
function noise(ac, out, o){
  const opt = Object.assign({t0:0, d:.1, g:.5, fc:4000}, o);
  const len = Math.max(1, Math.floor(ac.sampleRate * opt.d));
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const ch = buf.getChannelData(0);
  for(let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opt.fc;
  const v = ac.createGain(); v.gain.value = opt.g;
  src.connect(f); f.connect(v); v.connect(out);
  src.start(ac.currentTime + opt.t0);
}
const DEMOS = {
  haha(ac, out, f, sp){
    const d = .13 / sp, gap = .17 / sp;
    [0,1,2,3].forEach(i => tone(ac, out, {type:'sawtooth', f0:(205 - i*18)*f, f1:(150 - i*18)*f, t0:i*gap, d, g:.38}));
    return 3*gap + d;
  },
  boing(ac, out, f, sp){
    const d = .8 / sp;
    tone(ac, out, {type:'triangle', f0:340*f, f1:60*f, d, g:.55});
    tone(ac, out, {type:'sine', f0:680*f, f1:120*f, d:d*.8, g:.18});
    return d;
  },
  airhorn(ac, out, f, sp){
    const d = 1.05 / sp;
    [0, 8, -6].forEach(det=>{
      const osc = ac.createOscillator(), v = ac.createGain();
      osc.type = 'sawtooth'; osc.detune.value = det;
      const T = ac.currentTime;
      osc.frequency.setValueAtTime(392*f, T);
      osc.frequency.linearRampToValueAtTime(466*f, T + .12/sp);
      v.gain.setValueAtTime(0.0001, T);
      v.gain.linearRampToValueAtTime(.22, T + .02);
      v.gain.setValueAtTime(.22, T + d - .14/sp);
      v.gain.linearRampToValueAtTime(0.0001, T + d);
      osc.connect(v); v.connect(out);
      osc.start(T); osc.stop(T + d + .05);
    });
    return d;
  },
  rimshot(ac, out, f, sp){
    noise(ac, out, {d:.09/sp, g:.6, fc:5200});
    tone(ac, out, {type:'triangle', f0:220*f, f1:80*f, d:.12/sp, g:.5});
    noise(ac, out, {t0:.13/sp, d:.28/sp, g:.32, fc:7500});
    return .13/sp + .3/sp;
  },
  trombone(ac, out, f, sp){
    const steps = [233, 208, 185, 156], d = .34 / sp;
    steps.forEach((fr, i) => tone(ac, out, {type:'sawtooth', f0:fr*f, f1:fr*.94*f, t0:i*d, d:d*1.06, g:.32}));
    return steps.length * d + .05;
  },
  tada(ac, out, f, sp){
    const d = .55 / sp;
    [523, 659, 784, 1047].forEach((fr, i) => tone(ac, out, {type:'triangle', f0:fr*f, t0:i*.06/sp, d, g:.26}));
    noise(ac, out, {d:.4/sp, g:.1, fc:9000});
    return .18/sp + d;
  }
};
const DEMO_SET = [
  {id:'demo-haha',     label:'Ha ha ha',     emoji:'😂', synth:'haha',     who:'david', added:'demo'},
  {id:'demo-boing',    label:'Boing',        emoji:'🌀', synth:'boing',    who:'david', added:'demo'},
  {id:'demo-trombone', label:'Sad trombone', emoji:'📉', synth:'trombone', who:'david', added:'demo'},
  {id:'demo-airhorn',  label:'Airhorn',      emoji:'📯', synth:'airhorn',  who:'max',   added:'demo'},
  {id:'demo-rimshot',  label:'Rimshot',      emoji:'🥁', synth:'rimshot',  who:'max',   added:'demo'},
  {id:'demo-tada',     label:'Ta-da',        emoji:'🎉', synth:'tada',     who:'max',   added:'demo'}
];
function playDemo(s, bar, rowEl){
  const ac = ctx();
  const token = ++seq, sp = state.speed, f = state.keepPitch ? 1 : sp;
  const master = ac.createGain();
  master.gain.value = .9;
  master.connect(ac.destination);
  const dur = DEMOS[s.synth](ac, master, f, sp);
  if(rowEl) rowEl.classList.add('live');
  let raf, killed = false, elapsed = 0, last = performance.now();
  const end = ()=>{
    if(killed) return; killed = true;
    cancelAnimationFrame(raf);
    if(bar) bar.style.width = '0%';
    if(rowEl) rowEl.classList.remove('live');
    try{ master.disconnect(); }catch(_){}
    state.playing.delete(token);
    if(state.playing.size === 0) state.paused = false;
    lampSync();
  };
  const step = t=>{
    const dt = (t - last) / 1000; last = t;
    if(!state.paused) elapsed += dt;
    const p = Math.min(elapsed / dur, 1);
    if(bar) bar.style.width = (p * 100) + '%';
    if(p < 1) raf = requestAnimationFrame(step); else end();
  };
  raf = requestAnimationFrame(step);
  state.playing.set(token, {
    stop: ()=>{
      try{ master.gain.setTargetAtTime(0.0001, ac.currentTime, .01); }catch(_){}
      setTimeout(end, 25);
    },
    pause: ()=>{ if(AC && AC.state === 'running') AC.suspend(); },
    resume: ()=>{ if(AC && AC.state === 'suspended') AC.resume(); }
  });
  state.paused = false;
  lampSync();
}

boot();
